# Every Toolshed application, vulnerable and patched, side by side.
#
#   docker compose up -d --build          # all twenty
#   docker compose up -d python go        # a subset
#   docker compose ps                     # which port is which
#   docker compose down -v                # stop and drop the volumes
#
# app          -> http://localhost:81NN
# app-patched  -> http://localhost:82NN

x-toolshed: &toolshed
  restart: unless-stopped
  environment:
    TOOLSHED_TOKEN_KEY: compose-instance-key-long-enough-for-hs256
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
    interval: 10s
    timeout: 3s
    retries: 18

services:
  python:
    <<: *toolshed
    build: ./python/app
    image: guinea-pig/python-app
    container_name: toolshed-python
    ports: ["127.0.0.1:8101:8000"]
    volumes:
      - python_data:/srv/toolshed/var

  python-patched:
    <<: *toolshed
    build: ./python/app-patched
    image: guinea-pig/python-app-patched
    container_name: toolshed-python-patched
    ports: ["127.0.0.1:8201:8000"]
    volumes:
      - python_patched_data:/srv/toolshed/var

  go:
    <<: *toolshed
    build: ./go/app
    image: guinea-pig/go-app
